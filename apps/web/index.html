<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Presentation</title>
    <style>
      /* Fast pre-JS paint: match app background + show loader */
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: radial-gradient(1200px 700px at 50% 10%, rgba(110, 168, 255, 0.12), transparent 60%),
          radial-gradient(900px 500px at 30% 80%, rgba(255, 120, 190, 0.08), transparent 65%),
          #0b1020;
        color: rgba(255, 255, 255, 0.92);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      }
      #ip-preload {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 999999;
        background: transparent;
        pointer-events: none;
      }
      #ip-preload .card {
        pointer-events: none;
        display: grid;
        place-items: center;
        gap: 14px;
        padding: 22px 22px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(10px);
      }
      #ip-preload .spinner {
        width: 30px;
        height: 30px;
        border-radius: 999px;
        border: 3px solid rgba(255, 255, 255, 0.20);
        border-top-color: rgba(110, 168, 255, 0.95);
        animation: ipspin 0.9s linear infinite;
      }
      #ip-preload .txt {
        font-size: 13px;
        letter-spacing: 0.2px;
        color: rgba(255, 255, 255, 0.80);
      }
      @keyframes ipspin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="ip-preload" aria-hidden="true">
      <div class="card">
        <div class="spinner"></div>
        <div class="txt">Loading presentation…</div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
